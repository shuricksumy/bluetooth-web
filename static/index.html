<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bluetooth Panel</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --fg: #14171a; --muted: #667085;
    --card: #ffffff; --line: #e3e6ea; --accent: #2f6fed;
    --ok: #1a7f45; --okbg: #e5f5ec; --warn: #8a6100; --warnbg: #fdf3d8;
    --dangerbg: #fdeaea; --danger: #a52222;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --fg: #e8eaed; --muted: #98a2b3;
      --card: #1d2125; --line: #2c3238; --accent: #6a9bff;
      --ok: #6ee7a8; --okbg: #14361f; --warn: #f2c94c; --warnbg: #3a2f0c;
      --dangerbg: #3a1a1a; --danger: #ff8a8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem 1rem; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 62rem; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin-bottom: 1rem; }
  h1 { font-size: 1.3rem; margin: 0; flex: 1 1 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: .6rem .75rem; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  td.mac { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; color: var(--muted); white-space: nowrap; }
  td.actions { text-align: right; white-space: nowrap; }
  button {
    font: inherit; padding: .35rem .7rem; margin-left: .3rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
  button.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  .badge {
    display: inline-block; font-size: .7rem; font-weight: 600; padding: .12rem .45rem;
    border-radius: 999px; margin-right: .25rem; background: var(--line); color: var(--muted);
  }
  .badge.on { background: var(--okbg); color: var(--ok); }
  .note { padding: .6rem .8rem; border-radius: 8px; margin-bottom: .75rem; font-size: .88rem; }
  .note.err { background: var(--dangerbg); color: var(--danger); }
  .note.warn { background: var(--warnbg); color: var(--warn); }
  .muted { color: var(--muted); font-size: .85rem; }
  select { font: inherit; padding: .3rem; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  .empty { padding: 1.5rem; text-align: center; color: var(--muted); }
</style>

<main>
  <header>
    <h1>Bluetooth Panel</h1>
    <label class="muted">scan
      <select id="duration">
        <option value="5">5s</option>
        <option value="10" selected>10s</option>
        <option value="20">20s</option>
        <option value="30">30s</option>
      </select>
    </label>
    <button id="scan" class="primary">Scan</button>
  </header>

  <div id="notes"></div>

  <div class="card">
    <table>
      <thead>
        <tr><th>Device</th><th>Address</th><th>State</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty">Loading&hellip;</div>
  </div>

  <p class="muted" id="status"></p>
</main>

<script>
(() => {
  "use strict";
  const rows = document.getElementById("rows");
  const notes = document.getElementById("notes");
  const empty = document.getElementById("empty");
  const status = document.getElementById("status");
  const scanBtn = document.getElementById("scan");
  const durationSel = document.getElementById("duration");

  let busy = false;      // an action or scan is in flight: pause polling
  let timer = null;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function note(text, kind) {
    const div = document.createElement("div");
    div.className = "note " + (kind || "warn");
    div.textContent = text;
    notes.appendChild(div);
  }

  function setNotes(data, err) {
    notes.replaceChildren();
    if (err) note(err, "err");
    if (data && data.error) note(data.error, "err");
    (data && data.warnings || []).forEach((w) => note(w, "warn"));
  }

  function render(devices) {
    rows.replaceChildren();
    empty.style.display = devices.length ? "none" : "block";
    if (!devices.length) empty.textContent = "No devices known yet — hit Scan.";

    for (const d of devices) {
      const tr = document.createElement("tr");
      const badge = (label, on) =>
        `<span class="badge${on ? " on" : ""}">${label}</span>`;

      // Contextual actions: only offer what makes sense for this device's state.
      const acts = [];
      if (!d.paired) acts.push(`<button data-act="pair" class="primary">Pair &amp; Connect</button>`);
      if (d.connected) acts.push(`<button data-act="disconnect">Disconnect</button>`);
      else if (d.paired) acts.push(`<button data-act="connect" class="primary">Connect</button>`);
      if (d.paired && !d.trusted) acts.push(`<button data-act="trust">Trust</button>`);
      if (d.paired) acts.push(`<button data-act="remove" class="danger">Remove</button>`);

      tr.innerHTML =
        `<td>${esc(d.name)}</td>` +
        `<td class="mac">${esc(d.mac)}</td>` +
        `<td>${badge("Paired", d.paired)}${badge("Connected", d.connected)}${badge("Trusted", d.trusted)}</td>` +
        `<td class="actions">${acts.join("")}</td>`;

      tr.querySelectorAll("button").forEach((b) => {
        b.addEventListener("click", () => act(b.dataset.act, d));
      });
      rows.appendChild(tr);
    }
  }

  function setBusy(on, label) {
    busy = on;
    scanBtn.disabled = on;
    document.querySelectorAll("#rows button").forEach((b) => (b.disabled = on));
    status.textContent = label || "";
  }

  async function call(url, options) {
    const res = await fetch(url, options);
    let data = {};
    try { data = await res.json(); } catch (_) { /* non-JSON body */ }
    if (!res.ok && !data.error) data.error = `HTTP ${res.status}`;
    return data;
  }

  async function refresh() {
    if (busy) return;
    const data = await call("/api/devices");
    setNotes(data);
    if (data.devices) render(data.devices);
    if (data.stale) status.textContent = "showing last known list";
    else if (!busy) status.textContent = "";
  }

  async function act(kind, device) {
    setBusy(true, `${kind}… ${device.name}`);
    const data = await call(`/api/${kind}/${encodeURIComponent(device.mac)}`, { method: "POST" });
    setNotes(data);
    if (data.devices) render(data.devices);
    setBusy(false, data.ok ? `${kind} ok` : "");
    refresh();
  }

  async function scan() {
    const seconds = Number(durationSel.value);
    setBusy(true, `scanning for ${seconds}s…`);
    const data = await call("/api/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ duration: seconds }),
    });
    setNotes(data);
    if (data.devices) render(data.devices);
    setBusy(false, "");
  }

  scanBtn.addEventListener("click", scan);
  refresh();
  timer = setInterval(refresh, 5000);
})();
</script>
