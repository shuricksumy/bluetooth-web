# bluetooth-web -- pair Bluetooth audio sinks from a browser.
# Published image. Open http://<host>:8088 once it is up.
services:
  bluetooth-web:
    image: ghcr.io/shuricksumy/bluetooth-web-snapclient:latest
    container_name: bluetooth-web

    ports:
      - "8088:8080"

    # Ubuntu (and any AppArmor host): Docker confines containers with the
    # `docker-default` profile, which grants no D-Bus rules, so the kernel's
    # D-Bus mediation denies the container's "Hello" and it can never register
    # on the system bus -- bluetoothctl then dumps core. The socket mount is
    # fine; this is host policy. Uncomment on such hosts. Not needed on Debian,
    # Alpine or any host without AppArmor enforcement.
    #security_opt:
    #  - apparmor=unconfined

    volumes:
      # The Bluetooth half needs only this. Read-write is required: D-Bus is a
      # bidirectional socket, :ro breaks the connection. No privileged mode, no
      # cap_add, no host networking -- the panel only makes method calls into
      # the host's bluetoothd. The three mounts below are for the Snapcast
      # players; drop them if you only want device pairing.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      # Players are snapclient processes in this container, so it needs the
      # host's PipeWire session the same way pipewire-snapclient does. Check
      # your uid with `id -u`; 1000 is the usual desktop user.
      - /run/user/1000/pipewire-0:/tmp/pipewire-0
      # PipeWire's shared-memory transport
      - /dev/shm:/dev/shm
      # Keeps players.json across image updates
      - ./bluetooth-web-config:/config

    environment:
      # HTTP Basic Auth over every route. Leave empty (or drop the line) to
      # disable auth entirely -- only sane on a trusted LAN, since anyone who
      # reaches the port can then pair and unpair your devices.
      - ADMIN_PASSWORD=changeme
      - ADMIN_USER=admin

    restart: unless-stopped
